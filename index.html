
<!DOCTYPE html>
<html>
<head>
    <title>Image Gallery</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <h1>My Image Gallery</h1>
    <p>Welcome to my beautiful image gallery</p>

    <div class="gallery">

        <img src="images/image1.jpg" alt="Nature">
        <img src="images/image2.jpg" alt="Mountain">
        <img src="images/image3.jpg" alt="Flowers">
        <img src="images/image4.jpg" alt="Beach">
        <img src="images/image5.jpg" alt="Animals">
        <img src="images/image6.jpg" alt="Buildings">

    </div>

<div class="lightbox" id="lightbox">

    <span class="close" id="close">&times;</span>

    <button id="prev">❮</button>

    <img id="lightbox-img" src="" alt="">

    <button id="next">❯</button>

</div>

    <script src="js/script.js"></script>

</body>
</html>
